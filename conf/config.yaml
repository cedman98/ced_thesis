marktstammdatenregister:
  bulk_download_url: "https://download.marktstammdatenregister.de/Stichtag/Gesamtdatenexport_20260401_25.2.zip"
  bulk_explanation_download_url: "https://www.marktstammdatenregister.de/MaStRHilfe/files/gesamtdatenexport/Dokumentation%20MaStR%20Gesamtdatenexport.zip"
  wind:
    file_name: "EinheitenWind.xml"
    local_path: "data/mastr/gesamtdaten/EinheitenWind.xml"
  solar:
    file_name: "EinheitenSolar"
    local_path: "data/mastr/gesamtdaten"

processing:
  measurements:
    final_columns:
      - "station_id"
      - "record_date"
      - "average_wind_speed"
      - "average_wind_direction"
      - "air_pressure"
      - "air_temperature_2m"
      - "air_temperature_5cm"
      - "relative_humidity"
      - "dew_point_temperature"
      - "precipitation_duration"
      - "sum_precipitation_height"
      - "precipitation_indicator"
      - "quality_level"

  weather_stations:
    final_columns:
      - "weather_station_id"
      - "height"
      - "latitude"
      - "longitude"
      - "name"
      - "state"
      - "start_date"
      - "end_date"
      - "accessible"
      - "is_active"

  wind_turbines:
    final_columns:
      - "unit_mastr_number"
      - "last_update_date"
      - "longitude"
      - "latitude"
      - "commissioning_date"
      - "final_decommission_date"
      - "gross_power"
      - "net_nominal_power"
      - "manufacturer"
      - "technology"
      - "type_designation"
      - "hub_height"
      - "rotor_diameter"

  solar_installations:
    final_columns:
      - "unit_mastr_number"
      - "last_update_date"
      - "longitude"
      - "latitude"
      - "commissioning_date"
      - "final_decommission_date"
      - "gross_power"              # Equivalent to kWp (kilowatt-peak)
      - "net_nominal_power"        # Inverter AC limit
      - "is_ground_mounted"        # Critical flag: Freiflächenanlage vs. Gebäude (Rooftop)
      - "azimuth"                  # Orientation: 180 = South, 90 = East, 270 = West
      - "tilt"                     # Angle from horizontal
      - "has_battery_storage"      # Boolean indicating behind-the-meter storage interference

wind_power_calculation:
  alpha: 0.14                      # Hellmann exponent for neutral atmospheric stability
  measurement_height: 10           # Baseline meteorological measurement height (m)

solar_power_calculation:
  temperature_coefficient: -0.0035 # Efficiency loss per °C above 25°C (standard crystalline silicon)
  stc_temperature: 25              # Standard Test Condition temperature (°C)
  inverter_efficiency: 0.96        # Generic baseline for AC/DC transformation losses

open_meteo:
  archive_url: "https://archive-api.open-meteo.com/v1/archive"
  forecast_url: "https://api.open-meteo.com/v1/forecast"
  
  openstreetmap:
    relation_id: 62504             # Official OSM Relation ID for the State of Brandenburg
    admin_level: 4                  # Federal State (Bundesland) administrative level in Germany
    overpass_api_url: "https://overpass-api.de/api/interpreter"
    geojson_local_path: "data/external/brandenburg_boundary.geojson"
    
  grid_resolution: 0.1
  cluster_radius_km: 3.0
  variables:
    # Common variables
    - "temperature_2m"
    - "relative_humidity_2m"
    - "surface_pressure"
    - "cloud_cover"
    # Wind-specific variables
    - "wind_speed_10m"
    - "wind_speed_100m"
    - "wind_direction_10m"
    - "wind_direction_100m"
    # Solar-specific variables
    - "shortwave_radiation"
    - "direct_radiation"
    - "diffuse_radiation"
    - "direct_normal_irradiance"

scraper:
  api_base_url: "https://api-energiemonitor.eon.com"
  tenant_id: "1101"
  interval_minutes: 15
  regions:
    koenigs_wusterhausen:
      code: "12061260"
      csv_path: "data/webscrape_kwusterhausen.csv"
      lat: 52.298
      lon: 13.626
      results_dir: "results/kwusterhausen"   # kept for existing notebooks 05/07
    nauen:
      code: "12063208"
      csv_path: "data/webscrape_nauen.csv"
      lat: 52.61
      lon: 12.87
      results_dir: "results/nauen"

# State-wide forecasting registry: the 14 Landkreise + 4 kreisfreie Städte of
# Brandenburg. Assets are assigned to a district by point-in-polygon (MaStR has
# no Kreis field), so boundaries are fetched once from Nominatim and cached.
districts:
  boundaries_geojson: "data/external/brandenburg_districts.geojson"
  results_dir: "results/forecasts"
  fallback_mode: "identity"   # identity (scale 1.0 / offset 0.0) | pooled (mean scale, offset 0)
  landkreise:
    - "Barnim"
    - "Dahme-Spreewald"
    - "Elbe-Elster"
    - "Havelland"
    - "Märkisch-Oderland"
    - "Oberhavel"
    - "Oberspreewald-Lausitz"
    - "Oder-Spree"
    - "Ostprignitz-Ruppin"
    - "Potsdam-Mittelmark"
    - "Prignitz"
    - "Spree-Neiße"
    - "Teltow-Fläming"
    - "Uckermark"
  kreisfreie_staedte:
    - "Brandenburg an der Havel"
    - "Potsdam"
    - "Cottbus"
    - "Frankfurt (Oder)"